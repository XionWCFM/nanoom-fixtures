lefthook: mise exec -- yarn exec lefthook

pre-commit:
  commands:
    format:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx,json,jsonc,yml,yaml,md,css}"
      run: mise exec -- yarn exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    lint:
      glob: "*.{js,cjs,mjs,jsx,ts,tsx}"
      run: mise exec -- yarn exec oxlint {staged_files}
