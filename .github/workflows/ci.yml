name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scenario:
    uses: ./.github/workflows/scale-scenario.yml
    with:
      scenario: small

  status:
    if: always()
    needs: scenario
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.scenario.result }}
        run: test "$RESULT" = success
