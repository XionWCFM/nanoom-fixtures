name: nanoom e2e
# The workflow is intentionally exercised on pull requests and main pushes.
# nanoom owns event ref resolution and tool detection.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.calculate.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - id: calculate
        uses: XionWCFM/nanoom/.github/actions/affected@main
  run:
    name: run
    needs: affected
    if: ${{ fromJSON(needs.affected.outputs.groups).ci.hasChange }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.groups).ci.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: corepack enable
      - uses: XionWCFM/nanoom/.github/actions/install@main
        with:
          matrix: ${{ toJSON(matrix) }}
      - uses: XionWCFM/nanoom/.github/actions/run@main
        with:
          matrix: ${{ toJSON(matrix) }}
  status:
    name: status
    if: always()
    needs: [affected, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: XionWCFM/nanoom/.github/actions/status@main
        with:
          needs: ${{ toJSON(needs) }}
          matrixJob: run
          group: ci
