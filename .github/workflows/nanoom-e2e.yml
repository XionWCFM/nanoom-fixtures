name: nanoom e2e
# The workflow is intentionally exercised on pull requests and main pushes.
# nanoom owns event ref resolution and tool detection.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.calculate.outputs.groups }}
      result: ${{ steps.calculate.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - name: Create deterministic shared-only change
        id: comparison
        run: |
          git config user.email fixture@example.com
          git config user.name "nanoom fixture"
          echo '// synthetic affected fixture change' >> packages/shared/index.ts
          git add packages/shared/index.ts
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git commit --no-gpg-sign -m "test: synthetic shared change"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: calculate
        uses: XionWCFM/nanoom/.github/actions/affected@v0.2.6
        with:
          base: ${{ steps.comparison.outputs.base }}
          head: ${{ steps.comparison.outputs.head }}
  run:
    name: run
    needs: affected
    if: ${{ fromJSON(needs.affected.outputs.groups).ci.hasChange }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.groups).ci.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: corepack enable
      - id: install
        uses: XionWCFM/nanoom/.github/actions/install@v0.2.6
        with:
          matrix: ${{ toJSON(matrix) }}
      - name: Test focused install
        run: yarn verify:install '${{ matrix.name }}'
      - id: task
        uses: XionWCFM/nanoom/.github/actions/run@v0.2.6
        with:
          matrix: ${{ toJSON(matrix) }}
  status:
    name: status
    if: always()
    needs: [affected, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - id: aggregate
        uses: XionWCFM/nanoom/.github/actions/status@v0.2.6
        with:
          needs: ${{ toJSON(needs) }}
          matrixJob: run
          group: ci
