name: nanoom e2e
# The workflow is intentionally exercised on pull requests and main pushes.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
env:
  PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
  PULL_REQUEST_HEAD_REF: ${{ github.head_ref || github.sha }}
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.calculate.outputs.has_change }}
      matrix: ${{ steps.calculate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - run: |
          git fetch origin main:main --depth=100
          if [ -n "$GITHUB_HEAD_REF" ]; then git fetch origin "$GITHUB_HEAD_REF:$GITHUB_HEAD_REF" --depth=100; fi
      - id: calculate
        uses: XionWCFM/nanoom/.github/actions/affected@main
        with:
          group: ci
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          head: ${{ github.sha }}
  matrix:
    name: Run ${{ matrix.name }}
    needs: affected
    if: needs.affected.outputs.has_change == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: corepack enable
      - uses: XionWCFM/nanoom/.github/actions/install@main
        with:
          packageManager: yarn
          matrix: ${{ toJSON(matrix) }}
      - uses: XionWCFM/nanoom/.github/actions/run@main
        with:
          packageManager: yarn
          monorepoTool: turbo
          matrix: ${{ toJSON(matrix) }}
  status:
    name: Aggregate dynamic matrix status
    if: always()
    needs: [affected, matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: XionWCFM/nanoom/.github/actions/status@main
        with:
          needs: ${{ toJSON(needs) }}
