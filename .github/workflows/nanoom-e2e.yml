name: nanoom e2e
# The workflow is intentionally exercised on pull requests and main pushes.
# nanoom owns event ref resolution and tool detection.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.calculate.outputs.groups }}
      result: ${{ steps.calculate.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - name: Create deterministic shared-only change
        id: comparison
        run: |
          git config user.email fixture@example.com
          git config user.name "nanoom fixture"
          echo '// synthetic affected fixture change' >> packages/shared/index.ts
          git add packages/shared/index.ts
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git commit --no-gpg-sign -m "test: synthetic shared change"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: calculate
        uses: XionWCFM/nanoom/.github/actions/affected@v0.2.5
        with:
          base: ${{ steps.comparison.outputs.base }}
          head: ${{ steps.comparison.outputs.head }}
      - name: Assert transitive affected report
        env:
          RESULT: ${{ steps.calculate.outputs.result }}
          BASE: ${{ steps.comparison.outputs.base }}
          HEAD: ${{ steps.comparison.outputs.head }}
        run: |
          jq -e --arg base "$BASE" --arg head "$HEAD" '
            .affected.diagnostics.comparison.baseCommit == $base and
            .affected.diagnostics.comparison.headCommit == $head and
            .affected.diagnostics.reasons["@nanoom-fixture/shared"].kind == "direct" and
            .affected.diagnostics.reasons["@nanoom-fixture/core"].dependencyPath == ["@nanoom-fixture/core", "@nanoom-fixture/shared"] and
            .affected.diagnostics.reasons["@nanoom-fixture/app"].dependencyPath == ["@nanoom-fixture/app", "@nanoom-fixture/core", "@nanoom-fixture/shared"] and
            ([.matrix.ci.include[].name] | sort) == ["@nanoom-fixture/app", "@nanoom-fixture/core", "@nanoom-fixture/core", "@nanoom-fixture/shared"]
          ' <<< "$RESULT"
  run:
    name: run
    needs: affected
    if: ${{ fromJSON(needs.affected.outputs.groups).ci.hasChange }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.groups).ci.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: corepack enable
      - id: install
        uses: XionWCFM/nanoom/.github/actions/install@v0.2.5
        with:
          matrix: ${{ toJSON(matrix) }}
      - name: Assert focused install
        run: yarn verify:install '${{ matrix.name }}'
      - name: Assert install result
        env:
          RESULT: ${{ steps.install.outputs.result }}
        run: jq -e '.status == "success" and .cli.scope.dependencyClosure and .cli.scope.devDependencies' <<< "$RESULT"
      - id: task
        uses: XionWCFM/nanoom/.github/actions/run@v0.2.5
        with:
          matrix: ${{ toJSON(matrix) }}
      - name: Assert run result
        env:
          RESULT: ${{ steps.task.outputs.result }}
        run: jq -e '.status == "success" and .cli.status == "success" and .reason != ""' <<< "$RESULT"
  status:
    name: status
    if: always()
    needs: [affected, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - id: aggregate
        uses: XionWCFM/nanoom/.github/actions/status@v0.2.5
        with:
          needs: ${{ toJSON(needs) }}
          matrixJob: run
          group: ci
      - name: Assert status result
        env:
          RESULT: ${{ steps.aggregate.outputs.result }}
        run: jq -e '.status == "success" and .hasChange and .matrixResult == "success" and .reason != ""' <<< "$RESULT"
