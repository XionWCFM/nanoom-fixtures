name: nanoom e2e
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
env:
  PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
  PULL_REQUEST_HEAD_REF: ${{ github.head_ref || github.sha }}
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.calculate.outputs.has_change }}
      matrix: ${{ steps.calculate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - id: calculate
        uses: XionWCFM/nanoom/.github/actions/affected@main
        with: {group: ci}
  matrix:
    name: Run ${{ matrix.name }}
    needs: affected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: corepack enable
      - uses: XionWCFM/nanoom/.github/actions/install@main
        with:
          packageManager: yarn
          matrix: ${{ toJSON(matrix) }}
      - uses: XionWCFM/nanoom/.github/actions/run@main
        with:
          packageManager: yarn
          monorepoTool: turbo
          matrix: ${{ toJSON(matrix) }}
  status:
    if: always()
    needs: [affected, matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: XionWCFM/nanoom/.github/actions/status@main
        with:
          needs: ${{ toJSON(needs) }}
