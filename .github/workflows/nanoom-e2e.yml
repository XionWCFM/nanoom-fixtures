name: nanoom e2e

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  affected:
    name: Calculate affected matrix
    runs-on: ubuntu-latest
    outputs:
      has_change: ${{ steps.calculate.outputs.has-change }}
      matrix: ${{ steps.calculate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Enable Yarn 4
        run: corepack enable
      - id: calculate
        uses: XionWCFM/nanoom/.github/actions/nanoom-affected@c03db82c8d3ac8c025d007ea2e17e3e25d879d8f
        with:
          version: v0.1.7
          group: ci
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha || '' }}
          head: ${{ github.sha }}

  matrix:
    name: Run ${{ matrix.name }}
    needs: affected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install selected workspace dependency closure
        uses: XionWCFM/nanoom/.github/actions/nanoom-install@c03db82c8d3ac8c025d007ea2e17e3e25d879d8f
        with:
          version: v0.1.7
          package-manager: yarn
          filter: ${{ matrix.name }}
      - name: Run selected workspace through Turbo
        uses: XionWCFM/nanoom/.github/actions/nanoom-run@c03db82c8d3ac8c025d007ea2e17e3e25d879d8f
        with:
          version: v0.1.7
          group: ci
          task: ${{ matrix.task }}
          runner: turbo
          filter: ${{ matrix.name }}
          shard: ${{ matrix.shard }}
          total-shards: 2
          isolate: ${{ matrix.isolate }}

  status:
    name: Aggregate dynamic matrix status
    needs: [affected, matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Report direct matrix job result
        uses: XionWCFM/nanoom/.github/actions/nanoom-status@c03db82c8d3ac8c025d007ea2e17e3e25d879d8f
        with:
          version: v0.1.7
          jobs: affected,matrix
          results: affected=${{ needs.affected.result }},matrix=${{ needs.matrix.result }}
          format: markdown
